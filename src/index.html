<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar-container">
      <h2>Projects</h2>
      <div id="sidebar"></div>
      <button id="add-project-btn">+ New Project</button>
    </aside>

    <main id="main-container">
      <div class="main-header">
        <h1 id="active-project-title"></h1>
        <button id="add-todo-btn">+ New Todo</button>
      </div>
      <div id="todo-list"></div>
    </main>

    <div id="modal" class="hidden">
      <div class="modal-content">
        <button type="button" id="close-modal-btn" class="close-btn">&times;</button>
        <h2 id="modal-title">New Todo</h2>
        <form id="todo-form">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required />

          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3"></textarea>

          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" name="dueDate" />

          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2"></textarea>

          <button type="submit">Save Todo</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
